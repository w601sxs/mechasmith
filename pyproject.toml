[project]
name = "mechasmith"
version = "0.1.0"
description = "Agent-first robot design: CAD as Python code to a checked, simulatable MuJoCo model"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "Shreyas Subramanian", email = "shreyas.subramanian@scale.com" }
]
requires-python = ">=3.12"
keywords = ["robotics", "cad", "mujoco", "mjcf", "urdf", "simulation", "reinforcement-learning", "agents"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "build123d>=0.13.0",
    "manifold3d>=3.5.4",
    "mujoco>=3.17.0",
    "numpy>=2.5.4",
    "pillow>=13.0.0",
    "scipy>=1.18.1",
    "trimesh>=5.2.0",
]

[project.optional-dependencies]
urdf = ["yourdfpy"]

[project.urls]
Homepage = "https://github.com/w601sxs/mechasmith"
Repository = "https://github.com/w601sxs/mechasmith"
Issues = "https://github.com/w601sxs/mechasmith/issues"

[project.scripts]
mechasmith = "mechasmith.cli:main"

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mechasmith"]

[tool.hatch.build.targets.wheel.force-include]
"designs" = "mechasmith/designs"

[tool.hatch.build.targets.sdist]
include = ["/src/mechasmith", "/designs", "/README.md", "/AGENTS.md", "/LICENSE", "/pyproject.toml"]
